[meta]
label = Root Firstboot Startup Service (runs startup-root.sh)
label.ja = root初回起動サービス (startup-root.sh を実行) を有効化
description = Run startup-root.sh as root on first boot
description.ja = 初回起動時に root で startup-root.sh を実行する
check = true
default = false
order = 110
PLUGIN_ISO_DIR = true

[prompts]
enable_startup.type = boolean
enable_startup.label = Enable basic startup service? (runs startup-root.sh immediately)
enable_startup.label.ja = 通常の起動サービスを有効化しますか (startup-root.sh をすぐに実行)
enable_startup.default = true

enable_startup_network.type = boolean
enable_startup_network.label = Enable network-wait startup service? (runs startup-root-network.sh after network)
enable_startup_network.label.ja = ネットワーク待機起動サービスを有効化しますか (startup-root-network.sh をネットワーク接続後に実行)
enable_startup_network.default = true

[post]
# Create log directory
mkdir -p /var/log/make-rocky-bootable

# Create basic startup service (no network wait)
cat << 'EOF' > /etc/systemd/system/firstboot-root-startup.service
[Unit]
Description=Run startup-root.sh as root on first boot
After=basic.target

[Service]
Type=oneshot
ExecStart=/bin/bash -x /run/initramfs/live/scripts/make-rocky-bootable/plugins/firstboot-root-startup/startup-root.sh
ExecStartPost=/bin/rm -f /etc/systemd/system/firstboot-root-startup.service /etc/systemd/system/multi-user.target.wants/firstboot-root-startup.service
StandardOutput=append:/var/log/make-rocky-bootable/firstboot-root-startup.log
StandardError=append:/var/log/make-rocky-bootable/firstboot-root-startup.log

[Install]
WantedBy=multi-user.target
EOF

# Create network-wait startup service
cat << 'EOF' > /etc/systemd/system/firstboot-root-startup-network.service
[Unit]
Description=Run startup-root-network.sh as root on first boot (after network)
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
ExecStart=/bin/bash -x /run/initramfs/live/scripts/make-rocky-bootable/plugins/firstboot-root-startup/startup-root-network.sh
ExecStartPost=/bin/rm -f /etc/systemd/system/firstboot-root-startup-network.service /etc/systemd/system/multi-user.target.wants/firstboot-root-startup-network.service
StandardOutput=append:/var/log/make-rocky-bootable/firstboot-root-startup.log
StandardError=append:/var/log/make-rocky-bootable/firstboot-root-startup.log

[Install]
WantedBy=multi-user.target
EOF

${if_enable_startup}systemctl enable firstboot-root-startup.service${endif_enable_startup}
${if_enable_startup_network}systemctl enable firstboot-root-startup-network.service${endif_enable_startup_network}
