[meta]
label = Root Firstboot Startup Service (runs startup-root.sh)
label.ja = root初回起動サービス (startup-root.sh を実行) を有効化
description = Run startup-root.sh as root on first boot
description.ja = 初回起動時に root で startup-root.sh を実行する
check = true
default = true
order = 110
PLUGIN_ISO_DIR = true

[post]
# Create log directory
mkdir -p /var/log/make-rocky-bootable

# Create a systemd service for running the root startup script once at boot
cat << 'EOF' > /etc/systemd/system/firstboot-root-startup.service
[Unit]
Description=Run startup-root.sh as root on first boot
After=network.target

[Service]
Type=oneshot
ExecStart=/bin/bash -x /run/initramfs/live/scripts/make-rocky-bootable/plugins/firstboot-root-startup/startup-root.sh
ExecStartPost=/bin/rm -f /etc/systemd/system/firstboot-root-startup.service /etc/systemd/system/multi-user.target.wants/firstboot-root-startup.service
StandardOutput=append:/var/log/make-rocky-bootable/firstboot-root-startup.log
StandardError=append:/var/log/make-rocky-bootable/firstboot-root-startup.log

[Install]
WantedBy=multi-user.target
EOF
systemctl enable firstboot-root-startup.service
