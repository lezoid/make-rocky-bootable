[meta]
label = Kiosk Browser
label.ja = Kioskブラウザ
description = Clone, build, and install the kiosk browser during image creation. Internet access is required during build.
description.ja = イメージ作成中に kiosk ブラウザを clone・ビルド・導入する。ビルド時にインターネット接続が必要。
check = true
order = 95
supported_os = rocky8, rocky9, rocky10
requires = add-user
requires.rocky8 = add-xfce-gui-support
requires.rocky9 = add-xfce-gui-support
requires.rocky10 = add-kde-gui-support
PLUGIN_ISO_DIR = true

[prompts]
homepage.type = text
homepage.label = Homepage URL
homepage.label.ja = ホームページ URL
homepage.default = https://www.google.com

check_type.type = text
check_type.label = Connectivity check type (icmp/tcp/http)
check_type.label.ja = 疎通確認タイプ (icmp/tcp/http)
check_type.default = http

check_target.type = text
check_target.label = Connectivity check target
check_target.label.ja = 疎通確認対象
check_target.default = https://www.google.com

check_port.type = text
check_port.label = Connectivity check TCP port
check_port.label.ja = 疎通確認 TCP ポート
check_port.default = 80

urlbox.type = boolean
urlbox.label = Show URL box
urlbox.label.ja = URL ボックスを表示する
urlbox.default = true

homebutton.type = boolean
homebutton.label = Show Home button
homebutton.label.ja = Home ボタンを表示する
homebutton.default = true

backbutton.type = boolean
backbutton.label = Show Back button
backbutton.label.ja = Back ボタンを表示する
backbutton.default = true

autohomesec.type = text
autohomesec.label = Auto return to homepage after N seconds
autohomesec.label.ja = N 秒後に自動でホームへ戻る
autohomesec.default = 0

disable_context_menu.type = boolean
disable_context_menu.label = Disable context menu
disable_context_menu.label.ja = コンテキストメニューを無効化する
disable_context_menu.default = true

user_agent.type = text
user_agent.label = User-Agent string
user_agent.label.ja = User-Agent 文字列
user_agent.default = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36 Edg/133.0.0.0

toolbar_height.type = text
toolbar_height.label = Toolbar height in pixels
toolbar_height.label.ja = ツールバー高さ(px)
toolbar_height.default = 64

log_mode.type = text
log_mode.label = Log mode (off/normal/debug)
log_mode.label.ja = ログモード (off/normal/debug)
log_mode.default = normal

[post]
TARGET_USER='${name}'
GIT_URL='https://github.com/lezoid/rocky-kiosk-browser.git'
GIT_REF='main'
KIOSK_HOMEPAGE='${homepage}'
KIOSK_CHECK_TYPE='${check_type}'
KIOSK_CHECK_TARGET='${check_target}'
KIOSK_CHECK_PORT='${check_port}'
KIOSK_URLBOX='${urlbox}'
KIOSK_HOMEBUTTON='${homebutton}'
KIOSK_BACKBUTTON='${backbutton}'
KIOSK_AUTOHOMESEC='${autohomesec}'
KIOSK_DISABLE_CONTEXT_MENU='${disable_context_menu}'
KIOSK_USER_AGENT='${user_agent}'
KIOSK_TOOLBAR_HEIGHT='${toolbar_height}'
KIOSK_LOG_MODE='${log_mode}'
INSTALL_ROOT='/opt/make-rocky-bootable/kiosk-browser'
REPO_DIR='/var/tmp/kiosk-browser-src'
BUILD_DIR='/var/tmp/kiosk-browser-build'
PLUGIN_RUNTIME_DIR='/run/initramfs/live/scripts/make-rocky-bootable/plugins/kiosk-browser'
TARGET_HOME="/home/${TARGET_USER}"
if [ "${TARGET_USER}" = "root" ]; then TARGET_HOME='/root'; fi
. /etc/os-release
OS_MAJOR="${VERSION_ID%%.*}"
if ! id "${TARGET_USER}" >/dev/null 2>&1; then
  echo "target user not found: ${TARGET_USER}" >&2
  exit 1
fi
mkdir -p "${INSTALL_ROOT}/bin" "${INSTALL_ROOT}/share/assets" "${INSTALL_ROOT}/share/config"
rm -rf "${REPO_DIR}" "${BUILD_DIR}"
dnf -y install epel-release 'dnf-command(config-manager)' || true
dnf config-manager --set-enabled crb || true
dnf clean all || true
dnf -y install git cmake gcc-c++ make qt6-qtbase-devel qt6-qtwebengine qt6-qtwebengine-devel
git clone --depth 1 --branch "${GIT_REF}" "${GIT_URL}" "${REPO_DIR}" || {
  git clone "${GIT_URL}" "${REPO_DIR}" &&
  cd "${REPO_DIR}" &&
  git checkout "${GIT_REF}"
}
cmake -S "${REPO_DIR}" -B "${BUILD_DIR}"
cmake --build "${BUILD_DIR}" -j"$(nproc)"
install -m 0755 "${BUILD_DIR}/kiosk-browser-poc" "${INSTALL_ROOT}/bin/kiosk-browser"
cat << EOF > "${INSTALL_ROOT}/kiosk-browser.env"
KIOSK_HOMEPAGE='${KIOSK_HOMEPAGE}'
KIOSK_CHECK_TYPE='${KIOSK_CHECK_TYPE}'
KIOSK_CHECK_TARGET='${KIOSK_CHECK_TARGET}'
KIOSK_CHECK_PORT='${KIOSK_CHECK_PORT}'
KIOSK_URLBOX='${KIOSK_URLBOX,,}'
KIOSK_HOMEBUTTON='${KIOSK_HOMEBUTTON,,}'
KIOSK_BACKBUTTON='${KIOSK_BACKBUTTON,,}'
KIOSK_AUTOHOMESEC='${KIOSK_AUTOHOMESEC}'
KIOSK_DISABLE_CONTEXT_MENU='${KIOSK_DISABLE_CONTEXT_MENU,,}'
KIOSK_USER_AGENT='${KIOSK_USER_AGENT}'
KIOSK_TOOLBAR_HEIGHT='${KIOSK_TOOLBAR_HEIGHT}'
KIOSK_LOG_MODE='${KIOSK_LOG_MODE}'
KIOSK_TARGET_USER='${TARGET_USER}'
KIOSK_INSTALL_ROOT='${INSTALL_ROOT}'
KIOSK_PLUGIN_RUNTIME_DIR='${PLUGIN_RUNTIME_DIR}'
EOF
cat << 'EOF' > "${INSTALL_ROOT}/bin/run-kiosk-browser.sh"
#!/usr/bin/env bash
set -euo pipefail
INSTALL_ROOT='/opt/make-rocky-bootable/kiosk-browser'
source "${INSTALL_ROOT}/kiosk-browser.env"
RUNTIME_CONFIG_DIR="${HOME}/.local/share/make-rocky-bootable/kiosk-browser/config"
mkdir -p "${RUNTIME_CONFIG_DIR}" "${HOME}/.local/log/make-rocky-bootable"
if [ -f "${KIOSK_PLUGIN_RUNTIME_DIR}/config/domain-policy.json" ]; then
  install -m 0644 "${KIOSK_PLUGIN_RUNTIME_DIR}/config/domain-policy.json" "${RUNTIME_CONFIG_DIR}/domain-policy.json"
fi
if [ -f "${KIOSK_PLUGIN_RUNTIME_DIR}/config/page-list.json" ]; then
  install -m 0644 "${KIOSK_PLUGIN_RUNTIME_DIR}/config/page-list.json" "${RUNTIME_CONFIG_DIR}/page-list.json"
fi
args=(
  "--homepage=${KIOSK_HOMEPAGE}"
  "--check-type=${KIOSK_CHECK_TYPE}"
  "--check-target=${KIOSK_CHECK_TARGET}"
  "--check-port=${KIOSK_CHECK_PORT}"
  "--toolbar-height=${KIOSK_TOOLBAR_HEIGHT}"
  "--autohomesec=${KIOSK_AUTOHOMESEC}"
  "--page-list-json=${RUNTIME_CONFIG_DIR}/page-list.json"
  "--domain-policy-json=${RUNTIME_CONFIG_DIR}/domain-policy.json"
  "--log-dir=${HOME}/.local/log/make-rocky-bootable"
  "--log-mode=${KIOSK_LOG_MODE}"
  "--user-agent=${KIOSK_USER_AGENT}"
)
[[ "${KIOSK_URLBOX}" == "true" ]] && args+=("--urlbox")
[[ "${KIOSK_HOMEBUTTON}" == "true" ]] && args+=("--homebutton")
[[ "${KIOSK_BACKBUTTON}" == "true" ]] && args+=("--backbutton")
[[ "${KIOSK_DISABLE_CONTEXT_MENU}" == "true" ]] && args+=("--disable-context-menu")
exec "${INSTALL_ROOT}/bin/kiosk-browser" "${args[@]}"
EOF
chmod 0755 "${INSTALL_ROOT}/bin/run-kiosk-browser.sh"
if [ "${OS_MAJOR}" = "8" ] || [ "${OS_MAJOR}" = "9" ]; then
cat << 'EOF' > "${INSTALL_ROOT}/bin/apply-session-hardening.sh"
#!/usr/bin/env bash
set -euo pipefail
if command -v xfconf-query >/dev/null 2>&1; then
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Primary><Alt>Delete' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/XF86LogOff' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Primary><Alt>End' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Primary><Alt>Escape' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Primary>Escape' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Super>e' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Super>p' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/commands/custom/<Super>r' -n -t string -s /usr/bin/true || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Alt>Tab' -n -t string -s "" || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Alt>F4' -n -t string -s "" || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Super>Tab' -n -t string -s "" || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Alt>space' -n -t string -s "" || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Alt>F11' -n -t string -s "" || true
  xfconf-query -c xfce4-keyboard-shortcuts -p '/xfwm4/custom/<Alt>F9' -n -t string -s "" || true
  xfconf-query -c xfwm4 -p '/general/cycle_windows_key' -n -t string -s "" || true
  xfconf-query -c xfwm4 -p '/general/close_window_key' -n -t string -s "" || true
  xfwm4 --replace >/dev/null 2>&1 &
fi
EOF
elif [ "${OS_MAJOR}" = "10" ]; then
cat << 'EOF' > "${INSTALL_ROOT}/bin/apply-session-hardening.sh"
#!/usr/bin/env bash
set -euo pipefail
export TARGET_HOME="${HOME}"
python3 - <<'PY'
from configparser import ConfigParser
from pathlib import Path
import os

path = Path(os.environ["TARGET_HOME"]) / ".config" / "kglobalshortcutsrc"
path.parent.mkdir(parents=True, exist_ok=True)
cfg = ConfigParser(interpolation=None)
cfg.optionxform = str
if path.exists():
    cfg.read(path, encoding="utf-8")

updates = [
    ("ksmserver", "Log Out"),
    ("ksmserver", "Log Out Without Confirmation"),
    ("kwin", "Walk Through Windows"),
    ("kwin", "Walk Through Windows (Reverse)"),
    ("kwin", "Window Close"),
    ("kwin", "Window Operations Menu"),
    ("kwin", "Kill Window"),
    ("plasmashell", "activate application launcher"),
    ("plasmashell", "show dashboard"),
]

def disable_shortcut(value: str) -> str:
    parts = value.split(",", 2)
    if len(parts) == 3:
        return f"none,none,{parts[2]}"
    if len(parts) == 2:
        return f"none,none,{parts[1]}"
    if len(parts) == 1 and parts[0]:
        return f"none,none,{parts[0]}"
    return "none,none,"

for section, key in updates:
    if not cfg.has_section(section):
        cfg.add_section(section)
    current = cfg.get(section, key, fallback="none,none,")
    cfg.set(section, key, disable_shortcut(current))

with path.open("w", encoding="utf-8") as fh:
    cfg.write(fh)
PY
EOF
else
cat << 'EOF' > "${INSTALL_ROOT}/bin/apply-session-hardening.sh"
#!/usr/bin/env bash
set -euo pipefail
exit 0
EOF
fi
chmod 0755 "${INSTALL_ROOT}/bin/apply-session-hardening.sh"
mkdir -p "${TARGET_HOME}/.config/systemd/user/default.target.wants" "${TARGET_HOME}/.local/log/make-rocky-bootable"
cat << EOF > "${TARGET_HOME}/.config/systemd/user/kiosk-browser-prepare.service"
[Unit]
Description=Prepare kiosk browser session hardening
After=default.target

[Service]
Type=oneshot
ExecStart=${INSTALL_ROOT}/bin/apply-session-hardening.sh
StandardOutput=append:%h/.local/log/make-rocky-bootable/kiosk-browser-prepare.log
StandardError=append:%h/.local/log/make-rocky-bootable/kiosk-browser-prepare.log

[Install]
WantedBy=default.target
EOF
cat << EOF > "${TARGET_HOME}/.config/systemd/user/kiosk-browser.service"
[Unit]
Description=Run kiosk browser
After=default.target kiosk-browser-prepare.service
Wants=kiosk-browser-prepare.service

[Service]
Type=simple
ExecStart=${INSTALL_ROOT}/bin/run-kiosk-browser.sh
Restart=always
RestartSec=2
StandardOutput=append:%h/.local/log/make-rocky-bootable/kiosk-browser-service.log
StandardError=append:%h/.local/log/make-rocky-bootable/kiosk-browser-service.log

[Install]
WantedBy=default.target
EOF
ln -sf ../kiosk-browser-prepare.service "${TARGET_HOME}/.config/systemd/user/default.target.wants/kiosk-browser-prepare.service"
ln -sf ../kiosk-browser.service "${TARGET_HOME}/.config/systemd/user/default.target.wants/kiosk-browser.service"
chown -R "${TARGET_USER}:${TARGET_USER}" "${TARGET_HOME}/.config/systemd" "${TARGET_HOME}/.local"
systemctl mask --force ctrl-alt-del.target
if [ "${OS_MAJOR}" = "9" ]; then
  mkdir -p /etc/X11/xorg.conf.d
  cat << 'EOF' > /etc/X11/xorg.conf.d/99-kiosk-vt.conf
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
EOF
fi
if [ "${OS_MAJOR}" = "10" ]; then
  mkdir -p "${TARGET_HOME}/.config"
  python3 - <<PY
from configparser import ConfigParser
from pathlib import Path
path = Path("${TARGET_HOME}/.config/kglobalshortcutsrc")
cfg = ConfigParser(interpolation=None)
cfg.optionxform = str
if path.exists():
    cfg.read(path, encoding="utf-8")
updates = [
    ("ksmserver", "Log Out"),
    ("ksmserver", "Log Out Without Confirmation"),
    ("kwin", "Walk Through Windows"),
    ("kwin", "Walk Through Windows (Reverse)"),
    ("kwin", "Window Close"),
    ("kwin", "Window Operations Menu"),
    ("kwin", "Kill Window"),
    ("plasmashell", "activate application launcher"),
    ("plasmashell", "show dashboard"),
]
def disable_shortcut(value: str) -> str:
    parts = value.split(",", 2)
    if len(parts) == 3:
        return f"none,none,{parts[2]}"
    if len(parts) == 2:
        return f"none,none,{parts[1]}"
    if len(parts) == 1 and parts[0]:
        return f"none,none,{parts[0]}"
    return "none,none,"
for section, key in updates:
    if not cfg.has_section(section):
        cfg.add_section(section)
    current = cfg.get(section, key, fallback="none,none,")
    cfg.set(section, key, disable_shortcut(current))
with path.open("w", encoding="utf-8") as fh:
    cfg.write(fh)
PY
  chown "${TARGET_USER}:${TARGET_USER}" "${TARGET_HOME}/.config/kglobalshortcutsrc"
fi
dnf -y remove git cmake gcc-c++ make qt6-qtbase-devel qt6-qtwebengine-devel qt6-qtdeclarative-devel qt6-qtpdf-devel qt6-qtpositioning-devel qt6-qtwebchannel-devel || true
dnf clean all || true
