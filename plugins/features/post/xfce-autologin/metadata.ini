[meta]
label = XFCE Auto Login
label.ja = XFCE 自動ログイン
description = Configure automatic login for a specified user on XFCE desktop
description.ja = XFCE デスクトップで指定ユーザーの自動ログインを設定する
check = true
order = 115
supported_os = rocky8, rocky9
requires = add-xfce-gui-support
PLUGIN_ISO_DIR = false

[prompts]
autologin_user.type = text
autologin_user.label = Username to auto-login
autologin_user.label.ja = 自動ログインするユーザー名
autologin_user.note = Specify "root" or a general user created by the "Create General User" addon
autologin_user.note.ja = "root" またはユーザー作成アドオンで作成した一般ユーザー名を指定してください
autologin_user.default = user
autologin_user.rule = linux_username

[post]
# Set XFCE as the session for the autologin user via AccountsService
# This ensures GDM launches an XFCE (Xorg) session instead of the default Wayland session
HOME_DIR="/home/${autologin_user}"
[[ "${autologin_user}" == "root" ]] && HOME_DIR="/root"

mkdir -p /var/lib/AccountsService/users
cat << EOF > /var/lib/AccountsService/users/${autologin_user}
[User]
XSession=xfce
EOF

mkdir -p /etc/accountsservice/user-templates
ICON_PATH="$HOME_DIR/.face"
cat << EOF > /etc/accountsservice/user-templates/${autologin_user}
[com.redhat.AccountsServiceUser.System]
id="rocky"
version-id="9.4"

[User]
Session=xfce
Icon=$ICON_PATH
SystemAccount=true
EOF

# Disable Wayland in GDM to force Xorg (required for XFCE + XRDP)
GDM_CONF=/etc/gdm/custom.conf
sed -i 's/^#\?WaylandEnable=.*/WaylandEnable=false/' "$GDM_CONF" || \
    sed -i '/^\[daemon\]/a WaylandEnable=false' "$GDM_CONF"

# Configure GDM auto-login
sed -i '/^AutomaticLogin=/d' "$GDM_CONF"
sed -i '/^AutomaticLoginEnable=/d' "$GDM_CONF"
sed -i '/^\[daemon\]/a AutomaticLoginEnable=True\nAutomaticLogin=${autologin_user}' "$GDM_CONF"
