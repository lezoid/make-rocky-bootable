[meta]
label = Create General User
label.ja = 一般ユーザー作成
description = Create a general-purpose user account
description.ja = 一般ユーザーを作成する
check = true
order = 90
PLUGIN_ISO_DIR = true

[prompts]
name.type = text
name.label = Username
name.label.ja = ユーザー名
name.default = user
name.rule = linux_username

password.type = password
password.label = Password for ${name}
password.label.ja = ${name}ユーザーのパスワードを入力してください
password.default = user

sudoer.type = boolean
sudoer.label = Add to wheel (sudoers)?
sudoer.label.ja = sudo権限を付与しますか
sudoer.default = true

disable_root_ssh.type = boolean
disable_root_ssh.label = Disable root SSH login?
disable_root_ssh.label.ja = rootのSSHログインを無効化しますか
disable_root_ssh.default = false

enable_firstboot_user_startup.type = boolean
enable_firstboot_user_startup.label = Enable first-login user startup service? (runs startup-user.sh)
enable_firstboot_user_startup.label.ja = 初回ログイン時の一般ユーザー起動サービスを有効化しますか (startup-user.sh を実行)
enable_firstboot_user_startup.default = false

[post]
${if_enable_firstboot_user_startup}install -d -m 0755 /etc/skel/.config/systemd/user/default.target.wants
install -d -m 0755 /etc/skel/.local/log/make-rocky-bootable
cat << 'EOF' > /etc/skel/.config/systemd/user/firstboot-user-startup.service
[Unit]
Description=Run startup-user.sh after first user login
After=default.target

[Service]
Type=oneshot
ExecStart=/bin/bash -x /run/initramfs/live/scripts/make-rocky-bootable/plugins/add-user/startup-user.sh
ExecStartPost=/bin/sh -c 'rm -f %h/.config/systemd/user/default.target.wants/firstboot-user-startup.service %h/.config/systemd/user/firstboot-user-startup.service'
StandardOutput=append:%h/.local/log/make-rocky-bootable/firstboot-user-startup.log
StandardError=append:%h/.local/log/make-rocky-bootable/firstboot-user-startup.log

[Install]
WantedBy=default.target
EOF
ln -sf ../firstboot-user-startup.service /etc/skel/.config/systemd/user/default.target.wants/firstboot-user-startup.service${endif_enable_firstboot_user_startup}

# Create general user
useradd ${name}
echo "${name}:${password}" | chpasswd
${if_sudoer}usermod -aG wheel ${name}${endif_sudoer}
${if_disable_root_ssh}sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
systemctl restart sshd${endif_disable_root_ssh}
