[meta]
label = XFCE GUI Support (XRDP)
label.ja = XFCE GUIサポート (XRDP)
description = Install XFCE desktop and XRDP
description.ja = XFCE デスクトップと XRDP をインストールする
check = true
order = 50
supported_os = rocky8, rocky9
PLUGIN_ISO_DIR = false

[packages]
langpacks-ja
glibc-langpack-ja

[post]
# Enable EPEL repository
dnf -y install epel-release

# Install GUI packages
dnf -y install langpacks-ja glibc-langpack-ja ibus-mozc firefox chromium xrdp

# Install XFCE desktop environment
dnf -y groupinstall "xfce"

# Create xinit files for skel and root
for path in /etc/skel /root; do
    echo "exec /usr/bin/xfce4-session" > $path/.Xclients
    echo "exec /usr/bin/xfce4-session" > $path/.xinitrc
    chmod +x $path/.Xclients
    chmod +x $path/.xinitrc
done

# Set gdm default session for xfce
for account in root; do
    icon_path="/home/$account/.face"
    [[ "$account" == "root" ]] && icon_path="/root/.face"
    sudo bash -c "cat <<EOL > /etc/accountsservice/user-templates/$account
[com.redhat.AccountsServiceUser.System]
id=\"rocky\"
version-id=\"9.4\"

[User]
Session=xfce
Icon=$icon_path
SystemAccount=true
EOL"
done

for useraccount in root; do
    sudo bash -c "cat <<EOL > /var/lib/AccountsService/users/$useraccount
[User]
XSession=xfce
EOL"
done

# IBus settings
for user in root; do
    bashrc_path="/home/$user/.bashrc"
    [[ "$user" == "root" ]] && bashrc_path="/root/.bashrc"
    cat <<EOL >> $bashrc_path

# IBus settings for input method
export GTK_IM_MODULE=ibus
export XMODIFIERS=@im=ibus
export QT_IM_MODULE=ibus
EOL
done

# Disable screensaver and DPMS for skel and root
for xfce_conf_dir in /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml /root/.config/xfce4/xfconf/xfce-perchannel-xml; do
    mkdir -p "$xfce_conf_dir"

    cat << 'EOF' > "$xfce_conf_dir/xfce4-screensaver.xml"
<?xml version="1.0" encoding="UTF-8"?>
<channel name="xfce4-screensaver" version="1.0">
  <property name="lock" type="empty">
    <property name="sleep-activation" type="bool" value="false"/>
  </property>
  <property name="saver" type="empty">
    <property name="mode" type="int" value="0"/>
    <property name="enabled" type="bool" value="false"/>
  </property>
</channel>
EOF

    cat << 'EOF' > "$xfce_conf_dir/xfce4-power-manager.xml"
<?xml version="1.0" encoding="UTF-8"?>
<channel name="xfce4-power-manager" version="1.0">
  <property name="xfce4-power-manager" type="empty">
    <property name="show-tray-icon" type="bool" value="false"/>
    <property name="lock-screen-suspend-hibernate" type="bool" value="false"/>
    <property name="dpms-enabled" type="bool" value="false"/>
    <property name="blank-on-ac" type="int" value="0"/>
  </property>
</channel>
EOF
done

# Disable X11 screensaver timeout via autostart (xset s off)
mkdir -p /etc/skel/.config/autostart
cat << 'EOF' > /etc/skel/.config/autostart/disable-xscreensaver.desktop
[Desktop Entry]
Type=Application
Name=Disable X11 Screensaver
Exec=xset s off
OnlyShowIn=XFCE;
X-XFCE-Autostart-Phase=Application
NoDisplay=true
EOF

# Set graphical target and enable XRDP
systemctl set-default graphical
systemctl enable xrdp --now
systemctl enable firewalld
firewall-offline-cmd --add-port=3389/tcp
