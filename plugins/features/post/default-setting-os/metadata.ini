[meta]
label = Default OS Settings
label.ja = 基本OS設定
description = Basic OS settings: SSH, firewalld, dnf
description.ja = SSH設定、firewalld などの基本OS設定
check = false
order = 15
PLUGIN_ISO_DIR = false

[post]
# Configure dnf: fastestmirror + timeout settings
cat << 'EOF' >> /etc/dnf/dnf.conf
fastestmirror=True
minrate=5000
timeout=30
retries=3
EOF

# Allow SSH login as root
sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/^#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
systemctl restart sshd

# Enable firewalld
systemctl enable firewalld
systemctl start firewalld
