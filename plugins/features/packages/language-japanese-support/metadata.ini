[meta]
label = Japanese Language Support
label.ja = 日本語サポート
description = Install Japanese language packs and set locale/keyboard/timezone
description.ja = 日本語パックと日本語ロケールをインストールする
check = true
order = 20
PLUGIN_ISO_DIR = false

[packages]
langpacks-ja
glibc-langpack-ja
google-noto-sans-cjk-ttc-fonts
google-noto-serif-cjk-ttc-fonts

[post]
# Install Japanese language packages and fonts
dnf -y install langpacks-ja glibc-langpack-ja google-noto-sans-cjk-ttc-fonts google-noto-serif-cjk-ttc-fonts

# Set system locale to Japanese
echo "LANG=ja_JP.UTF-8" > /etc/locale.conf

# Set keyboard layout to Japanese 109
echo "KEYMAP=jp106" > /etc/vconsole.conf

# Set X11 keyboard layout (localectl requires D-Bus and cannot be used in kickstart %post)
mkdir -p /etc/X11/xorg.conf.d
cat > /etc/X11/xorg.conf.d/00-keyboard.conf << 'EOF'
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "jp"
EndSection
EOF

# Set timezone to Asia/Tokyo
ln -snf /usr/share/zoneinfo/Asia/Tokyo /etc/localtime
echo "Asia/Tokyo" > /etc/timezone
